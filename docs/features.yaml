  # --- Profile ---------------------------------------------------------------
  - id: profile.highlights
    summary: Ball Knower and Gamer highlights
    web: done
    ios: done
  - id: profile.match-history
    summary: Match history and stats
    web: done
    ios: done
  - id: profile.takes-history
    summary: Your takes
    web: done
    ios: done
    note: The Huddle's take cards, newest first, each with an Answering strip that opens the prompt, the picks folded behind View take, and a reply count that opens the take's thread.

  - id: profile.layout
    summary: Profile header is the avatar, name and username, then Edit profile and Friends buttons, then Stats, Takes and Lists tabs
    web: done
    ios: done
    note: No email or join date on your own profile. Web keeps the join date on other players' profiles (/u/<username>). On iOS Edit profile and Friends moved out of the Profile menu into the buttons.
  - id: profile.player-lists
    summary: Lists tab on Profile and on another player's profile (their lists at the size they chose, with History)
    web: done
    ios: done
    note: Web shows each list in full on your own profile and on other players' profiles (/u/<username>?tab=lists), the newest open first; a 32-team Power Rankings shows all 32. Another player's profile now has the same Stats, Takes and Lists tabs as yours; their Takes tab shows only takes on prompts the viewer has answered or that have locked.  iOS has the same Lists tab on Profile and on another player's profile (Stats and Lists only; their Takes tab is a separate gap). What a viewer sees is decided in SQL (get_ranking_lists, get_ranking_list; migrations 0210 to 0213).
  - id: lists.tab
    summary: Lists in the main navigation, after Home, where you build your lists
    web: done
    ios: done
    note: Web has a Lists sidebar item (and drawer item) after Home, opening /lists. iOS has a Lists tab between Home and Games.
  - id: lists.editor
    summary: Build and edit a list (Power Rankings 5, 10 or 32; QB, RB and WR top 10), laid out like a prompt answer, pick up then place, save with a take, share with friends by default
    web: done
    ios: done
    note: 'Moving is drag and drop: drag a row onto the place it should take, and drag a benched team onto a place to bring it in (the last team drops to the bench). iOS drags by press and hold and is drag only (VoiceOver gets Move up and Move down actions). Web also keeps pick up then tap a row to place, or Up, Down, To #1 and To bottom, because mobile browsers do not drag reliably. Nothing saves until Save. Position lists start empty and fill from the player search. The page is laid out like a prompt answer page: a header, your card (author line, an optional take of 280 characters, the board, a "Share this update with friends" checkbox on by default and one Save button) and an About this list rail; off saves quietly and the version still shows in history. The server decides refusals (one saved edit per list per 24 hours, a prompt that is open, no change); the client shows its message. While a ranking prompt is open the list is read-only and links to the prompt. Rules: docs/architecture/ranking-lists.md.'
  - id: lists.history
    summary: Version history for a list, newest first, with what moved and the note (own lists at /lists/<kind>, others at /u/<username>/lists/<kind>)
    web: done
    ios: done
    note: Every saved version shows, published or not. Notes and "Shared with friends" markers show only to the owner and their friends.
  - id: lists.update-card
    summary: A shared list update as a friends-only take card (note, the whole list with each item's movement, replies), on the home Lists pill and in All and Friends
    web: done
    ios: done
    note: The home feed gets a Lists pill beside All, Prompts and Friends (/?filter=lists). The card is a take card: the note, then the whole new list with how far each item moved against the version it replaced; the reply icon goes to /lists/updates/<id> with the thread. Update cards are friends-only (and yours); everyone else gets not found. Update cards are kept out of the prompt feed, takes history and sitemap.
  - id: lists.prompt-prefill
    summary: Answering a ranking prompt opens pre-filled with your list and saves a new version
    web: missing
    ios: missing
    ticket: BPP-32 (web), BPP-34 (iOS)
    note: The database already does this (ranking_list_prefill, and submit_response saves the version, migration 0212). No client reads the prefill yet.

  # --- Friends ---------------------------------------------------------------
  - id: friends.list
    summary: Friends list, remove, block and unblock
    web: done
    ios: done
    note: Both clients open it from the Friends button on Profile (web /friends, iOS the Friends screen), which shows the friend count and a badge for pending requests. The screen has Friends, Requests and Add sections.
  - id: friends.requests-search-invite
    summary: Friend requests, username typeahead (prefix match, 3+ characters) and a shareable invite link
    web: done
    ios: done
    note: iOS opens https://ballparty.social/friends/invite/<code> as a Universal Link. That works only once the apple-app-site-association file (webapp/public/.well-known) is deployed and the Associated Domains capability is enabled for com.ballparty.app; not yet tested on a device.
  - id: friends.profiles
    summary: View another player's profile (public, friends-only and not-found states) with friend actions
    web: done
    ios: done
  - id: friends.activity-feed
    summary: Home is one feed with All, Prompts and Friends pills; Friends is the prompts a friend answered plus friends' multiplayer wins and new solo high scores from the last 30 days
    web: done
    ios: done
    note: Replaces the old Huddle | Friends tabs (migration 0209). All interleaves prompt cards and game moments newest first; Prompts is the prompts alone; Friends keeps only prompts a friend answered (dated by the newest friend answer) and the game moments. Real accounts only; guests and signed-out visitors see just the prompts, with no pills on web. A friend's answer is no longer its own card; it is the friends-answered line on the prompt card (see huddle.friends-answered). Wins and new bests are lighter game cards (a best shows the number, the friend's rank among you and your friends, and Beat it; a win names who it was over; one friend's wins on a day fold into one card). Losses, one-player matches and solo runs that set no new best are left out. Beat it and Play are underlined buttons with an arrow-up-right icon on both clients. Layout gaps: web pages with an Older link (/?filter=…&before=…) and its Beat it / Play buttons jump to /solo and /party, while iOS pages with Load more, Beat it opens the game's board and Play switches to the Party tab. Older iOS builds lose friends' takes from their Friends tab once 0209 is applied.
  - id: huddle.friends-answered
    summary: A prompt card says which friends answered it ("Sam & Jo answered", with their avatars), never what they picked
    web: done
    ios: done
    note: Server read is friends_who_answered (migration 0209). Shown on the All and Friends pills only. The picks stay hidden until the prompt locks and then live in the prompt's thread (huddle.friend-takes).

