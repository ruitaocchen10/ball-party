# Feature manifest: what the product does, and where each client stands.
#
# Read docs/parity.md for how this file is used. Status values per platform:
#   done      built and reachable by a player
#   partial   built but incomplete or not reachable; say why in `note`
#   missing   not built, and it should be (this is a gap)
#   no        deliberately absent on this platform; `note` must say why
#
# Gaps carry a `ticket:` key from Jira (mobile gaps live in BPMO, under the iOS App epic BPMO-2).
#
# Baseline from the 2026-10 parity audit. Statuses marked (unverified) came from
# a code search rather than running the app.

features:
  # --- Huddle (home feed) ---------------------------------------------------
  - id: huddle.feed-picks
    summary: Feed of picks, game picks, weekly picks
    web: done
    ios: done
  - id: huddle.power-rankings
    summary: Power Rankings ballot and consensus top five
    web: done
    ios: done
  - id: huddle.weekly-awards
    summary: Weekly Awards prompts
    web: done
    ios: done
  - id: huddle.bold-predictions
    summary: Bold Predictions prompts
    web: done
    ios: done
  - id: huddle.answer
    summary: Submit an answer to a prompt
    web: done
    ios: done
  - id: huddle.takes
    summary: Post takes and replies, take thread
    web: done
    ios: done
  - id: huddle.search
    summary: Search the feed
    web: done
    ios: missing
    ticket: BPMO-17
  - id: huddle.share-image
    summary: Share picks, takes and power rankings as an image
    web: done
    ios: missing
    ticket: BPMO-18
  - id: huddle.signed-out-read
    summary: Read the feed without an account
    web: done
    ios: no
    note: iOS is behind an auth gate by design

  # --- Accounts --------------------------------------------------------------
  - id: auth.email
