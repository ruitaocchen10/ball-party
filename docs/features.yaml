  # --- Rooms -----------------------------------------------------------------
  - id: rooms.create-join
    summary: Create a room, join from an invite or a room link, leave, close
    web: done
    ios: done
    note: iOS opens https://ballparty.social/lobby/<code> as a Universal Link and joins from the Party tab (not when already in a room), and sharing is the link: on iOS the room's invite bar is gone, and the invite sheet (opened from any open seat) starts with the link with Copy and Share, above the friend list. Like the friend invite link, it works only once the apple-app-site-association file (webapp/public/.well-known) is deployed; not yet tested on a device. There is no join code to type on either client: the link token (`lobbies.code`, 16 random characters since migration 0198) is only ever inside a link. Rooms opened before 0198 keep their five-character code until they close.
  - id: friends.room-invites
    summary: Invite friends into a room from the lobby; accept or decline from the Party page
    web: done
    ios: done
    note: Invites appear live on an open Party page / tab (Realtime on the recipient's own room_invites rows, then a re-read of list_room_invites). There is no push notification, so a closed app or tab sees them on next open.
  - id: notifications.bell
    summary: A bell in the header with an unread badge, opening the notification inbox
    web: done
    ios: done
    note: The inbox lists friend requests (accept or decline in place, tap for the profile), replies to your takes (tap for the take; several replies to one take collapse into one item) and room invites (join or decline in place; one that is no longer live shows as expired for three days). The server decides what is listed and what state it is in (list_inbox, migration 0204); read state is per item and an item is read when tapped or acted on, or all at once with Mark all read. Room invites count as unread while pending. The Party page and tab still list invites too. Push is tracked separately in notifications.push. The iOS header layout, Home header tabs and avatar tab icon are platform layout and are not tracked here.
  - id: notifications.push
    summary: Push notifications for a new prompt, a friend request, a room invite and a reply to your take
    web: missing
    ios: done
    ticket: BPW-6
    note: iOS only (GitHub #171, #172; details in docs/ios/push.md). The app registers with APNs and uploads its token (register_device_token, migration 0205), removes it on sign-out, and asks for permission after a first meaningful action (locking in a pick, making or joining a room, adding a friend) behind a short pre-prompt, again no sooner than 14 days after Not now. The server queues a push in the same transaction as the event (push_outbox, migration 0206) and the send-push Edge Function delivers it; the inbox stays the source of truth, so a push for something already read, answered, blocked or expired is dropped. Alerts are generic (no names or take text); replies to one take coalesce into one push; the admin create-post form has a checkbox to skip the push for a post. A tap opens the same place as the inbox row (Home for a new prompt) and the app badge is the unread count. Web push is deferred (BPW-6) because it needs its own service worker, keys and subscription storage; the bell and inbox (notifications.bell) are the web's only notification surface until then.
  - id: rooms.pick-game
    summary: Host picks the game and starts a run
    web: done
    ios: done
  - id: rooms.game-settings
    summary: Everyone in a room can see the game the host picked and how the host has set it up
    web: missing
    ios: done
    ticket: BPW-5
    note: The host's settings are saved on the room (`lobbies.game_format`, `set_lobby_game_format`, migration 0197) as they change. On iOS the Game tab is a row of full-width game cards of one fixed height for everyone; the host's swipe picks the game, the card shows its current settings as pills, and the host's Adjust settings button opens them in a sheet (pill choices for every either-or setting, dropdowns for seasons, roster and length; each change saves as it is made). A player's swipe only browses and sees the pills with no button. The Room tab shows the picked game and its settings, and the host's Start button is pinned to the bottom of the Room tab with the reason it is disabled (waiting for players, nothing picked) above it; the Game tab only chooses and configures. Web still keeps the host's settings in the host's browser until Start, so web players cannot see them.
  - id: rooms.seat-form
    summary: Each seat shows the player's win rate, best streak and last three results ("New" with no games)
    web: done
    ios: done
    note: Read from `lobby_member_match_history` (migration 0080) and summarised like the web's `summarizeProfile`. On iOS it sits under the avatar on the light seat card; a red dot is a win.
  - id: rooms.start-countdown
    summary: A 3-2-1 screen before the first phase of a room game, counted down to a start time the server sets
    web: done
    ios: done
    note: Higher or Lower, Auction Team Builder and Wavelength, including a replay. The server owns it (migration 0200). A room match carries `matches.play_starts_at`, three seconds after the host starts it, and every deadline the game set on the way in is pushed back by the same three seconds, so the first phase is full-length once the countdown ends. Each client reads the time with `match_play_start` (which also returns the server's clock) and counts down to it, so every player sees the same numbers and someone who opens the match late sees what is left. Solo runs have none. On iOS the auction's first lot reel plays after the countdown; the web auction still shows the first lot's player at once, as it always has (it only spins later lots).
  - id: games.winner-moment
    summary: A full-screen "Maya wins" beat when a room game ends, before the results
    web: done
    ios: done
    note: Higher or Lower, Auction Team Builder and Wavelength. Shows the winner's avatar (both on a tie, the winning team in Wavelength) and a line of why, auto-advances after about three seconds, and a click or key press skips it. A co-op loss shows it muted. Only for a player who watched the match end; rejoining a finished match goes straight to the results, which no longer carry a winner headline.
  - id: games.timer-format
    summary: Every visible game clock reads MM:SS in whole seconds (00:03), with no tenths
    web: missing
    ios: done
    note: Header clocks in Auction and Wavelength, and the Higher or Lower countdown. Web ticket still to be filed in BPW.
  - id: rooms.scoreboard
    summary: Wins each player has taken in the room since it opened
    web: done
    ios: done
    note: Counts `placement = 1` on the room's completed matches, so it resets when the room closes. On iOS it is the Scoreboard tab beside Room, under the Party header; on web it is a section on the room page. iOS reads it in the same snapshot as the roster. The tab shows a dot when somebody has won since you last looked.
  - id: rooms.party-mode
    summary: Multi-game party with points and a target score
    web: missing
    ios: missing
    note: not built anywhere; start_run only supports arcade

  # --- Games -----------------------------------------------------------------
  - id: game.higher-or-lower.solo
    summary: Higher or Lower, solo
    web: done
    ios: done
  - id: game.higher-or-lower.room
