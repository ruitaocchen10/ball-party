  - id: huddle.feed-picks
    summary: Feed of picks, game picks, weekly picks
    web: done
    ios: done
  - id: huddle.power-rankings
    summary: Power Rankings ballot and consensus top five
    web: done
    ios: done
  - id: huddle.weekly-awards
    summary: Weekly Awards prompts
    web: done
    ios: missing
    ticket: BPMO-15
    note: iOS shows an "update the app" placeholder
  - id: huddle.bold-predictions
    summary: Bold Predictions prompts
    web: done
    ios: missing
    ticket: BPMO-16
    note: iOS shows an "update the app" placeholder
  - id: huddle.answer
    summary: Submit an answer to a prompt
    web: done
    ios: done
  - id: huddle.takes
    summary: Post takes and replies, take thread
    web: done
    ios: done
  - id: huddle.search
    summary: Search the feed
    web: done
    ios: missing
    ticket: BPMO-17
  - id: huddle.share-image
    summary: Share picks, takes and power rankings as an image
    web: done
    ios: missing
    ticket: BPMO-18
  - id: huddle.signed-out-read
    summary: Read the feed without an account
    web: done
    ios: no
    note: iOS is behind an auth gate by design

  # --- Accounts --------------------------------------------------------------
  - id: auth.email
    summary: Sign up and sign in with email and password
    web: done
    ios: done
  - id: auth.google
    summary: Continue with Google
    web: done
    ios: done
  - id: auth.apple
    summary: Sign in with Apple
    web: missing
    ios: done
    note: (unverified) no Apple button found on web
  - id: auth.guest
    summary: Guest session for solo play
    web: done
    ios: no
    note: docs/app.md, "iOS never carries a guest session"
  - id: account.edit-profile
    summary: Edit display name, username and avatar
    web: done
    ios: done
  - id: account.username
    summary: Unique username (3-20 letters, digits, underscore), optional at signup, editable in edit-profile with a live availability check; existing accounts confirm their generated name once
    web: done
    ios: done
    note: Signup cannot check availability (no session until the email is confirmed), so the chosen name is claimed at first sign-in. The confirm prompt is remembered per device, not on the server.
  - id: account.private-profile
    summary: Private profile setting (only friends can open your profile; you stay searchable and ranked)
    web: done
    ios: done
    note: Web is in Settings; iOS is Privacy in the Profile menu.
  - id: account.change-credentials
    summary: Change email or password
    web: done
    ios: missing
    ticket: BPMO-10
    note: (unverified) no trace found on iOS
  - id: account.delete
    summary: Delete your account in-app
    web: done
    ios: done

  # --- Profile ---------------------------------------------------------------
  - id: profile.highlights
    summary: Ball Knower and Gamer highlights
    web: done
    ios: done
  - id: profile.match-history
