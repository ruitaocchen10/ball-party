# Feature manifest: what the product does, and where each client stands.
#
# Read docs/parity.md for how this file is used. Status values per platform:
#   done      built and reachable by a player
#   partial   built but incomplete or not reachable; say why in `note`
#   missing   not built, and it should be (this is a gap)
#   no        deliberately absent on this platform; `note` must say why
#
# Gaps carry a `ticket:` key from Jira (mobile gaps live in BPMO, under the iOS App epic BPMO-2).
#
# Baseline from the 2026-10 parity audit. Statuses marked (unverified) came from
# a code search rather than running the app.

features:
  # --- Huddle (home feed) ---------------------------------------------------
  - id: huddle.feed-picks
    summary: Feed of picks, game picks, weekly picks
    web: done
    ios: done
  - id: huddle.power-rankings
    summary: Power Rankings ballot and consensus top five
    web: done
    ios: done
  - id: huddle.weekly-awards
    summary: Weekly Awards prompts
    web: done
    ios: done
  - id: huddle.crowd-in-card
    summary: Crowd data inside the take card (award leader under each pick, Power Rankings "matched N of 5" line)
    web: done
    ios: done
  - id: huddle.take-card-layout
    summary: One take card layout on every prompt, Bold Predictions included (reply left, View take right; your own take starts open)
    web: done
    ios: done
  - id: huddle.prompt-card-layout
    summary: Prompt card is art on top (timer or state chip in its corner), then title, subtitle, who answered and the button, short enough for two cards on a phone
    web: done
    ios: done
    note: 'BPP-22. The chip reads Closes in 2d while open, then Completed (you answered), Locked, Resolved or Void. Art is one banner height for every kind (112px, 128px on wider web screens): a game is a broadcast graphic (each club color and an oversized logo bleeding off its edge, names big in the middle over kickoff and venue), a weekly slate is the game count as a headline beside the clubs of its first four games instead of a pager, Power Rankings is the six cover teams at mixed sizes, the first three climbing beside a green block arrow and the last three falling beside a red one, Weekly Awards is six medals, one per award (football, shield, trophy, flame, thumbs down, an L), Bold Predictions is six exclamation speech bubbles, blue on the left and red on the right, and the rest keep their covers as wordless banners. Layout gap: a pick-one prompt shows its candidates as headshot tiles on web and as a row of round badges on iOS.'
  - id: huddle.bold-predictions
    summary: Bold Predictions prompts
    web: done
    ios: done
  - id: huddle.answer
    summary: Submit an answer to a prompt
    web: done
    ios: done
  - id: huddle.takes
    summary: Post takes and replies, take thread
    web: done
    ios: done
  - id: huddle.friend-takes
    summary: Friends' takes lead a prompt's discussion, above Other takes
    web: done
    ios: done
  - id: huddle.every-answer-is-a-take
    summary: Every answer is a take, so every card on a prompt has a comment link and picks behind View take
    web: done
    ios: done
    note: Answering a prompt, or locking in Bold Predictions, always leaves a take (migration 0208), empty when the player wrote nothing, so a card with only picks still has a thread, a reply count and reply notifications; Bold Predictions cards show the person's predictions behind View take. Order on a prompt's page, for a reader who has answered or once the prompt has locked or resolved (before that, other players' takes stay hidden): Friend takes, Friend answers (no text), Other takes, Other answers. The Profile Takes tab still lists only takes with words.
  - id: huddle.balls
    summary: Give a take a ball (thumbs up) or take one away (thumbs down); net balls add to the Ball Knower score
    web: done
    ios: done
    note: 'BPP-39, migration 0216. Every take's action row has a thumbs up, the net ball count and a thumbs down, then the comment icon with its reply count (icons only, no container); once you like a take the thumbs up becomes a leather football. Top-level takes only, so a picks-only answer and a friends-only list update card count, replies do not. Your own take (and a reader who cannot react) shows a football and the count. Anyone with an account can like; only an accepted friend of the author can dislike (the down thumb is not drawn otherwise); you cannot react to your own take, and a guest or signed-out reader sees the count only. One reaction per player per take: the same thumb again removes it, the other switches it. The server decides all of it (`react_to_take`, and `take_reaction_summary` returns can_like and can_dislike), clients draw what it says. The leather-orange `ball` token is in globals.css and Theme.swift. Net balls are added into Ball Knower points, windowed by when the reaction was given or switched, so the board, profile and standing all show one number; the 3-scored-pick floor is unchanged, so balls alone never rank a player.'
  - id: huddle.search
    summary: Search the feed
    web: done
    ios: missing
    ticket: BPMO-17
  - id: huddle.share-image
    summary: Share picks, takes and power rankings as an image
    web: done
    ios: missing
    ticket: BPMO-18
  - id: huddle.signed-out-read
    summary: Read the feed without an account
    web: done
    ios: no
    note: iOS is behind an auth gate by design

