  - id: account.edit-profile
    summary: Edit display name, username and avatar
    web: done
    ios: done
  - id: account.username
    summary: Unique username (3-20 letters, digits, underscore), optional at signup, editable in edit-profile with a live availability check; existing accounts confirm their generated name once
    web: done
    ios: done
    note: Signup cannot check availability (no session until the email is confirmed), so the chosen name is claimed at first sign-in. The confirm prompt is remembered per device, not on the server.
  - id: account.private-profile
    summary: Private profile setting (only friends can open your profile; you stay searchable and ranked)
    web: done
    ios: done
    note: Web is in Settings; iOS is Privacy in the Profile menu.
  - id: account.change-credentials
    summary: Change email or password
    web: done
    ios: missing
    ticket: BPMO-10
    note: (unverified) no trace found on iOS
  - id: account.delete
