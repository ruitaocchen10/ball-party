    web: done
    ios: done
  - id: game.auction-team-builder
    summary: Auction Team Builder (room, 2-4)
    web: done
    ios: done
    note: 'The whole game plays on iOS: the host picks scoring, roster, tokens and era in the room, then bidding, custom bids, free lots, the Pass, Scout and Seal tokens, sealed rounds and the final table all match the web. Gaps: team logos (iOS shows team codes; the logo PNGs are not bundled), the host Pause button (web only), and the replay format picker (web lets the host change scoring, roster and era on Play again; iOS replays the same format). The lot reveal is the same slot reel as the web. iOS layout: custom and sealed bids are entered in a sheet, and the Table tab has one tab per player (budget, current bid, tokens, points, team) instead of every roster stacked.'
  - id: game.wavelength
    summary: 2v2 Wavelength (room, 2 or 4)
    web: done
    ios: done
    note: 'The whole game plays on iOS: the host picks co-op (with a length) or 2v2 in the room, then clue writing, the dial and live needle, locking a guess, the reveal (the table holds on the locked card until the host taps Next card) and the result screen (stars in co-op, winner in 2v2) match the web. Laid out as a pinned header (round, score, clock) over two native tabs, Dial and Rounds. Gaps: the host Pause button (web only), and the replay format picker (iOS replays the same format).'

