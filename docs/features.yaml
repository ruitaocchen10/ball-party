# Feature manifest: what the product does, and where each client stands.
#
# Read docs/parity.md for how this file is used. Status values per platform:
#   done      built and reachable by a player
#   partial   built but incomplete or not reachable; say why in `note`
#   missing   not built, and it should be (this is a gap)
#   no        deliberately absent on this platform; `note` must say why
#
# Gaps carry a `ticket:` key from Jira (mobile gaps live in BPMO, under the iOS App epic BPMO-2).
#
# Baseline from the 2026-10 parity audit. Statuses marked (unverified) came from
# a code search rather than running the app.

