name: CI

# Vercel's own git integration already builds and deploys every push and PR
# preview. This workflow is the gate Vercel doesn't provide: it runs the
# actual test suites (frontend + database + iOS) so a broken test shows up as a
# failed check on the PR instead of silently shipping.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations, seed, and Storage assets
        run: node scripts/team_logos/reset_local_db.mjs

      - name: Run pgTAP suite
        run: supabase test db

  player-pool:
    name: Player pool ETL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m unittest discover scripts/player_pool

  qb-ratings:
    name: QB Season Builder ratings tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m unittest discover scripts/qb_ratings

  qb-season-model:
    name: QB Season Builder season model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m unittest discover scripts/qb_season_model

  ios:
    name: iOS (build, test)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Create placeholder Secrets.xcconfig
        # The Debug config reads this gitignored file for SUPABASE_URL and
        # SUPABASE_ANON_KEY. The unit tests run against fakes and never reach
        # the network, so placeholders are enough; no real keys in CI.
        run: |
          cat > Secrets.xcconfig <<'EOF2'
          SUPABASE_URL = https:/$()/ci-placeholder.invalid
          SUPABASE_ANON_KEY = ci-placeholder
          EOF2

      - name: Pick an iPhone simulator
        # Runner images ship different Xcode/simulator versions, so take
        # whichever iPhone the runner has instead of naming one.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d['name'].startswith('iPhone') and d['isAvailable']:
                      print(d['udid']); sys.exit(0)
          sys.exit('no iPhone simulator available')
          ")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          xcodebuild test \
            -project BallParty.xcodeproj \
            -scheme BallParty \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  deploy-migrations:
    name: Push migrations to prod
    # Only once they've actually been proven against a fresh local stack --
    # never on a PR preview, and never if the pgTAP suite would have caught
    # something. This is the step that was missing when 0092 merged: green
    # CI and a real bug both shipped, because nothing pushed the fix's own
    # migration to the hosted project afterward.
    if: github.event_name == 'push'
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the hosted project
        run: supabase link --project-ref xjsbmxgnmrvqfsqcohjv
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Sync exposed Data API schemas
        # config.toml's api.schemas is already the file people edit when a new
        # game adds its own schema (prompts, wavelength, ...) -- but nothing
        # synced that list to the hosted project's Data API settings, so a
        # migration could ship a schema the API still 404s on (prompts sat
        # unexposed for a while this way; see the admin 404 this fixed).
        #
        # `supabase config push` isn't it here: it pushes every block the CLI
        # manages, and config.toml's auth/db/storage values are stale local
        # defaults that would stomp real prod settings (site_url, Apple
        # sign-in, the iOS redirect URL, pooler sizing). This hits the
        # Management API's dedicated postgrest-config endpoint instead, so
        # the only thing it can ever change is db_schema.
        run: python3 scripts/sync_exposed_schemas.py
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xjsbmxgnmrvqfsqcohjv
