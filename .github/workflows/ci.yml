name: CI

# Vercel's own git integration already builds and deploys every push and PR
# preview. This workflow is the gate Vercel doesn't provide: it runs the
# actual test suites (frontend + database) so a broken test shows up as a
# failed check on the PR instead of silently shipping.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations + seed
        run: supabase db reset

      - name: Run pgTAP suite
        run: supabase test db

  player-pool:
    name: Player pool ETL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m unittest discover scripts/player_pool

  deploy-migrations:
    name: Push migrations to prod
    # Only once they've actually been proven against a fresh local stack --
    # never on a PR preview, and never if the pgTAP suite would have caught
    # something. This is the step that was missing when 0092 merged: green
    # CI and a real bug both shipped, because nothing pushed the fix's own
    # migration to the hosted project afterward.
    if: github.event_name == 'push'
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the hosted project
        run: supabase link --project-ref xjsbmxgnmrvqfsqcohjv
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
