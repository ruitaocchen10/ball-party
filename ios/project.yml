name: BallParty
options:
  bundleIdPrefix: com.ballparty
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  BallParty:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BallParty
        excludes:
          - "**/*.md"
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_NAME: "Ball Party"
        # Otherwise derived from PRODUCT_NAME as "Ball_Party" — the space
        # becomes an underscore, which is legal but not what `@testable
        # import BallParty` (BallPartyTests) expects.
        PRODUCT_MODULE_NAME: BallParty
        PRODUCT_BUNDLE_IDENTIFIER: com.ballparty.app
        INFOPLIST_KEY_CFBundleDisplayName: "Ball Party"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated plist — carries CFBundleURLTypes (the
        # OAuth callback scheme) and the SUPABASE_* keys, none of which
        # INFOPLIST_KEY_* has a slot for.
        INFOPLIST_FILE: BallParty/Info.plist
        CODE_SIGN_ENTITLEMENTS: BallParty/BallParty.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Matches Theme.surface, so the launch screen doesn't flash a different black.
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: Surface
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  BallPartyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BallPartyTests
    dependencies:
      - target: BallParty
    settings:
      base:
        SWIFT_VERSION: "6.0"
